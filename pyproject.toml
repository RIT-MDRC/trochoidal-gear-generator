[project]
name = "right-angle-roller-gear"
version = "0.1.0"
description = "Numerical swept-volume generator for a 90-degree roller-pinion transmission"
requires-python = ">=3.11,<3.13"
dependencies = [
  "cadquery>=2.5,<3",
  "numpy>=2,<3",
]

[project.scripts]
rollergear = "rollergear:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rollergear"]
